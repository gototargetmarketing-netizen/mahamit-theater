<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f10">
    <meta name="robots" content="noindex">
    <title>สแกนเข้าโรง | MAHAMIT THEATER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- html5-qrcode (Apache-2.0) ใช้กล้องมือถือสแกน QR ได้ทั้ง iPhone และ Android (ตัวเดียวกับคอนเสิร์ต)
         defer: ไฟล์ใหญ่ราว 370 KB ไม่ต้องรอโหลดเสร็จก่อนแสดงหน้า (ใช้ตอนกดเปิดกล้องเท่านั้น) -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <!-- โครงหน้ายกมาจาก concert/scan.html ปรับเป็นหลายเรื่องหลายรอบ: โหลดเฉพาะตั๋ววันนี้ และเลือกรอบที่กำลังเข้าโรงได้ -->
    <style>
        :root {
            --dark: #0f0f10;
            --red: #8b1528;
            --ok: #176b4d;
            --bad: #a3262a;
            --warn: #b07a12;
            --gold: #d4af37;
            --cream: #f4f1ea;
            --line: #e5e1d6;
            --text: #1a1a1a;
            --muted: #6f6b63;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; background: var(--cream); color: var(--text); font-family: "Prompt", Arial, sans-serif; }
        button, select { font: inherit; }
        button { cursor: pointer; }
        .hidden { display: none !important; }

        /* ---------- เข้าสู่ระบบ ---------- */
        #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: var(--dark); }
        .login-card { width: 100%; max-width: 360px; background: #fff; border-radius: 22px; border-top: 5px solid var(--gold); padding: 28px 22px; text-align: center; }
        .login-card .brand { font-size: 12px; letter-spacing: 5px; color: var(--red); font-weight: 600; }
        .login-card h1 { font-size: 24px; margin: 6px 0 4px; }
        .login-card p { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
        #pinInput { width: 100%; font: inherit; font-size: 26px; letter-spacing: 8px; text-align: center; padding: 12px; border: 2px solid var(--line); border-radius: 14px; outline: none; }
        #pinInput:focus { border-color: var(--red); }
        .primary { width: 100%; margin-top: 14px; border: 0; border-radius: 14px; background: var(--red); color: #fff; font-size: 18px; font-weight: 600; padding: 14px; }
        .primary:disabled { opacity: .6; cursor: wait; }
        #loginError { color: var(--bad); font-size: 14px; margin-top: 12px; min-height: 20px; }

        /* ---------- แถบด้านบน ---------- */
        .topbar { position: sticky; top: 0; z-index: 10; background: var(--dark); color: #fff; padding: 10px 14px; border-bottom: 3px solid var(--red); }
        .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .staff { font-size: 15px; font-weight: 600; }
        .staff small { display: block; font-size: 11px; font-weight: 400; color: #b9b5ad; }
        .logout { background: transparent; border: 1px solid #ffffff55; color: #fff; border-radius: 999px; padding: 5px 12px; font-size: 13px; }
        #showSelect { width: 100%; margin-top: 8px; padding: 9px 12px; border-radius: 10px; border: 0; background: #ffffff1a; color: #fff; font-size: 15px; }
        #showSelect option { color: var(--text); }
        #showSelect.need { background: var(--gold); color: var(--text); font-weight: 600; animation: pulse 1.6s ease-in-out infinite; }
        @keyframes pulse { 50% { box-shadow: 0 0 0 4px #d4af3766; } }
        .primary.locked { background: #9a968d; }
        .stats { display: flex; gap: 8px; margin-top: 8px; }
        .stat { flex: 1; background: #ffffff14; border-radius: 10px; padding: 6px 8px; text-align: center; }
        .stat b { display: block; font-size: 20px; line-height: 1.2; }
        .stat span { font-size: 11px; color: #cfcac0; }
        .stat.pending b { color: var(--gold); }
        .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4ade80; margin-right: 4px; }
        .dot.off { background: #f87171; }

        .tabs { display: flex; background: #fff; border-bottom: 1px solid var(--line); }
        .tabs button { flex: 1; border: 0; background: none; padding: 12px; font-size: 16px; color: var(--muted); border-bottom: 3px solid transparent; }
        .tabs button.active { color: var(--red); font-weight: 600; border-bottom-color: var(--red); }

        main { max-width: 560px; margin: 0 auto; padding: 14px 14px 40px; }

        /* ---------- คำเตือน (เช่น สแกนซ้ำจากอีกเครื่อง) ---------- */
        .alert { display: flex; gap: 10px; align-items: flex-start; background: #fff4e0; border-left: 4px solid var(--warn); border-radius: 0 12px 12px 0; padding: 10px 12px; margin-bottom: 10px; font-size: 14px; line-height: 1.5; }
        .alert.bad { background: #fbe9e9; border-left-color: var(--bad); }
        .alert div { flex: 1; }
        .alert button { border: 0; background: none; font-size: 18px; color: var(--muted); padding: 0 4px; }

        /* ---------- สแกน ---------- */
        #reader { width: 100%; background: #000; border-radius: 18px; overflow: hidden; min-height: 280px; }
        #reader video { border-radius: 18px; }
        .scan-help { text-align: center; color: var(--muted); font-size: 14px; margin: 10px 0 0; }
        #startScan { margin-top: 0; }

        /* ---------- ค้นหา ---------- */
        #searchInput { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; outline: none; background: #fff; }
        #searchInput:focus { border-color: var(--red); }
        .order { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-top: 10px; }
        .order-name { font-weight: 600; font-size: 17px; }
        .order-meta { font-size: 12px; color: var(--muted); word-break: break-all; }
        .order-show { font-size: 13px; color: var(--red); font-weight: 600; margin-top: 2px; }
        .seat-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .seat-btn { border: 2px solid var(--ok); background: #fff; color: var(--ok); border-radius: 12px; padding: 8px 12px; font-size: 15px; font-weight: 600; min-width: 74px; }
        .seat-btn.done { border-color: var(--line); background: #f3f2ee; color: var(--muted); font-weight: 400; cursor: default; }
        .seat-btn small { display: block; font-size: 11px; font-weight: 400; }
        .empty { text-align: center; color: var(--muted); padding: 30px 10px; }

        /* ---------- ผลการสแกนเต็มจอ ---------- */
        #result { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; padding: 24px; }
        #result.ok { background: var(--ok); }
        #result.bad { background: var(--bad); }
        #result.warn { background: var(--warn); }
        #result.wait { background: #3b3a36; }
        .r-icon { font-size: 72px; line-height: 1; }
        .r-title { font-size: 30px; font-weight: 700; margin-top: 8px; }
        .r-seat { font-size: 64px; font-weight: 700; line-height: 1.1; margin-top: 14px; }
        .r-show { display: inline-block; margin-top: 8px; background: #fff; color: var(--text); border-radius: 14px; padding: 6px 18px; font-size: 20px; font-weight: 600; line-height: 1.4; }
        .r-detail { font-size: 18px; margin-top: 14px; line-height: 1.6; opacity: .95; }
        .r-detail .r-name { display: block; font-size: 26px; font-weight: 700; line-height: 1.3; }
        .r-next { margin-top: 26px; border: 2px solid #fff; background: transparent; color: #fff; border-radius: 999px; padding: 12px 34px; font-size: 18px; font-weight: 600; }
    </style>
</head>
<body>
    <!-- เข้าสู่ระบบด้วย PIN ทีมงาน -->
    <section id="login" class="hidden">
        <div class="login-card">
            <div class="brand">MAHAMIT THEATER</div>
            <h1>สแกนเข้าโรง</h1>
            <p>ใส่ PIN ทีมงานของคุณ</p>
            <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••">
            <button id="loginBtn" class="primary" type="button" onclick="login()">เข้าสู่ระบบ</button>
            <div id="loginError"></div>
        </div>
    </section>

    <!-- หน้าหลักทีมงาน -->
    <section id="app" class="hidden">
        <div class="topbar">
            <div class="topbar-row">
                <div class="staff"><span id="staffName">-</span><small><span id="netDot" class="dot"></span><span id="syncText">-</span></small></div>
                <button class="logout" type="button" onclick="logout()">ออกจากระบบ</button>
            </div>
            <!-- ต้องเลือกเรื่องและรอบก่อนสแกน: ตั๋วของรอบอื่นจะขึ้นเตือนและไม่บันทึก กันลูกค้าเข้าผิดรอบ -->
            <select id="showSelect" onchange="selectShow(this.value)"></select>
            <div class="stats">
                <div class="stat"><b id="statIn">0</b><span>เข้าโรงแล้ว</span></div>
                <div class="stat"><b id="statTotal">0</b><span>ที่นั่งทั้งหมด</span></div>
                <div class="stat pending"><b id="statPending">0</b><span>รอส่งข้อมูล</span></div>
            </div>
        </div>
        <div class="tabs">
            <button id="tabScan" class="active" type="button" onclick="showTab('scan')">📷 สแกน QR</button>
            <button id="tabSearch" type="button" onclick="showTab('search')">🔎 ค้นหาชื่อ</button>
        </div>
        <main>
            <div id="alerts"></div>

            <div id="scanView">
                <button id="startScan" class="primary" type="button" onclick="startScanner()">เปิดกล้องเพื่อสแกน</button>
                <div id="reader" class="hidden"></div>
                <p class="scan-help">ส่อง QR ในอีเมลหรือหน้าเปิดบัตรของลูกค้า · 1 QR = 1 ที่นั่ง</p>
            </div>

            <div id="searchView" class="hidden">
                <input id="searchInput" type="search" placeholder="ชื่อผู้จอง / เบอร์โทร / เลขจอง / ที่นั่ง" oninput="renderSearch()">
                <div id="searchResults"></div>
            </div>
        </main>
    </section>

    <!-- ผลการสแกนเต็มจอ -->
    <div id="result" class="hidden">
        <div class="r-icon" id="rIcon"></div>
        <div class="r-title" id="rTitle"></div>
        <div class="r-seat" id="rSeat"></div>
        <div id="rShowWrap"><span class="r-show" id="rShow"></span></div>
        <div class="r-detail" id="rDetail"></div>
        <button class="r-next" id="rNext" type="button" onclick="closeResult()">สแกนต่อ</button>
    </div>

    <script>
        /* ===== ตั้งค่า ===== */
        // ต้องตรงกับ URL Apps Script ใน index.html (ทดสอบ: ตั้ง localStorage mt_web_app_url แบบเดียวกับหน้าจอง)
        const DEFAULT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyuKn9-SJEnZLtRrt_0ypWTmwsDA3aU3ePd_P21BoTW67TXFOJwbjlEObi8D7R8_W4Srg/exec';
        // ต้องตรงกับ QR_PREFIX ใน Code.gs
        const QR_PREFIX = 'MT1';
        const REFRESH_MS = 30000;       // โหลดรายชื่อใหม่ทุก 30 วินาที
        const SYNC_MS = 5000;           // ส่งรายการที่รอส่งทุก 5 วินาที
        const SAME_QR_IGNORE_MS = 4000; // กล้องเห็น QR เดิมซ้ำ ภายในเวลานี้ไม่นับใหม่

        /* ===== เก็บข้อมูลในมือถือ (ปลอดภัยถ้าเบราว์เซอร์ปิด localStorage) ===== */
        function store(key, value) {
            try {
                if (value === undefined) localStorage.removeItem(key);
                else localStorage.setItem(key, JSON.stringify(value));
            } catch (e) { /* ไม่มีที่เก็บ ใช้งานต่อได้แต่จะจำไม่ได้หลังรีเฟรช */ }
        }
        function load(key, fallback) {
            try {
                const raw = localStorage.getItem(key);
                return raw ? JSON.parse(raw) : fallback;
            } catch (e) { return fallback; }
        }

        let webAppUrl = DEFAULT_WEB_APP_URL;
        try {
            const override = localStorage.getItem('mt_web_app_url');
            if (override && /^https:\/\/script\.google\.com\//.test(override)) webAppUrl = override;
        } catch (e) {}

        let session = load('mt_scan_session', null);        // { pin, name }
        let deviceId = load('mt_scan_device', null);
        if (!deviceId) {
            deviceId = 'D-' + Math.random().toString(36).slice(2, 8).toUpperCase();
            store('mt_scan_device', deviceId);
        }
        let pending = load('mt_scan_pending', []);          // รายการที่สแกนแล้วแต่ยังส่งไม่สำเร็จ
        // "ชื่อหนัง|รอบ" ที่กำลังเข้าโรง ว่าง = ยังไม่เลือก (ค่าเก่า "all" จากรุ่นก่อนถือว่ายังไม่เลือก)
        let selectedShow = load('mt_scan_show', '');
        if (selectedShow === 'all') selectedShow = '';
        let seatsByKey = {};                                  // "เลขจอง|ที่นั่ง" → { r, s, h, n, p, m, t }
        let serverCheckins = {};                              // "เลขจอง|ที่นั่ง" → { t, by }
        let dataDate = '';
        let lastLoadedAt = null;
        let syncing = false;
        let scanner = null;
        let lastScan = { text: '', at: 0 };

        /* ===== เรียก Apps Script ===== */
        // GET ใช้ JSONP เหมือนหน้าจอง (เว็บอยู่บน Vercel คนละโดเมนกับ Apps Script)
        // ชื่อ callback ต้องขึ้นต้นด้วย __scan_ (Code.gs ตรวจไว้)
        function callJsonp(params, timeoutMs = 30000) {
            return new Promise((resolve, reject) => {
                const cb = '__scan_' + Date.now() + '_' + Math.random().toString(36).slice(2);
                const script = document.createElement('script');
                let done = false;
                const cleanup = () => {
                    if (done) return;
                    done = true;
                    clearTimeout(timer);
                    delete window[cb];
                    script.remove();
                };
                const timer = setTimeout(() => { cleanup(); reject(new Error('หมดเวลารอระบบ')); }, timeoutMs);
                window[cb] = data => { cleanup(); resolve(data); };
                script.onerror = () => { cleanup(); reject(new Error('เชื่อมต่อระบบไม่สำเร็จ')); };
                const query = new URLSearchParams({ ...params, callback: cb, _: Date.now() });
                script.src = webAppUrl + (webAppUrl.includes('?') ? '&' : '?') + query.toString();
                document.head.appendChild(script);
            });
        }

        // POST แบบ text/plain อ่านผลได้โดยไม่ต้องทำ CORS preflight (แบบเดียวกับการจอง)
        async function postJson(payload) {
            const response = await fetch(webAppUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            return response.json();
        }

        /* ===== เข้าสู่ระบบ / ออกจากระบบ ===== */
        async function login() {
            const pin = document.getElementById('pinInput').value.trim();
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('loginError');
            if (!pin) { err.textContent = 'กรุณาใส่ PIN'; return; }
            btn.disabled = true;
            btn.textContent = 'กำลังตรวจสอบ…';
            err.textContent = '';
            try {
                const data = await callJsonp({ action: 'checkinData', pin: pin });
                if (!data || !data.success) throw new Error((data && data.message) || 'เข้าสู่ระบบไม่สำเร็จ');
                session = { pin: pin, name: data.staff };
                store('mt_scan_session', session);
                applyCheckinData(data);
                showApp();
            } catch (e) {
                err.textContent = e.message || 'เข้าสู่ระบบไม่สำเร็จ';
            } finally {
                btn.disabled = false;
                btn.textContent = 'เข้าสู่ระบบ';
            }
        }

        function logout(force) {
            if (!force && pending.length &&
                !confirm(`ยังมี ${pending.length} รายการที่ยังไม่ได้ส่งเข้าระบบ ถ้าออกตอนนี้รายการจะยังเก็บไว้ในเครื่องนี้ ออกจากระบบเลยไหม?`)) return;
            stopScanner();
            session = null;
            store('mt_scan_session', undefined);
            document.getElementById('pinInput').value = '';
            document.getElementById('app').classList.add('hidden');
            document.getElementById('login').classList.remove('hidden');
        }

        function showApp() {
            document.getElementById('login').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('staffName').textContent = session.name;
            renderShows();
            renderStatus();
        }

        /* ===== รายชื่อที่นั่ง (เฉพาะตั๋วที่ยืนยันแล้วของวันนี้) ===== */
        function applyCheckinData(data) {
            const next = {};
            (data.seats || []).forEach(s => { next[s.r + '|' + s.s] = s; });
            seatsByKey = next;
            if (data.checkins) serverCheckins = data.checkins;
            dataDate = data.date || '';
            lastLoadedAt = new Date();
            renderShows();
            renderStatus();
            if (!document.getElementById('searchView').classList.contains('hidden')) renderSearch();
        }

        async function refreshData() {
            if (!session) return;
            try {
                const data = await callJsonp({ action: 'checkinData', pin: session.pin });
                if (!data || !data.success) {
                    // ออกจากระบบเฉพาะเมื่อ PIN ใช้ไม่ได้แล้ว (ไม่ใช่ตอนระบบหยุดรับ PIN ชั่วคราว)
                    if (data && /PIN ไม่ถูกต้อง/.test(data.message || '')) {
                        alert('PIN ของคุณถูกปิดใช้งานหรือเปลี่ยนแล้ว กรุณาเข้าสู่ระบบใหม่');
                        logout(true);
                    }
                    return;
                }
                applyCheckinData(data);
                setOnline(true);
            } catch (e) {
                setOnline(false);
            }
        }

        /* ===== รอบฉาย ===== */
        function showKey(info) { return info.m + '|' + info.t; }
        function showLabel(info) { return `${info.m} · ${info.t} น.`; }

        // ตัวเลือกรอบสร้างจากตั๋วของวันนี้ เรียงตามเวลา
        function renderShows() {
            const shows = {};
            Object.values(seatsByKey).forEach(s => {
                const key = showKey(s);
                shows[key] = shows[key] || { key, label: showLabel(s), time: s.t, count: 0 };
                shows[key].count++;
            });
            const list = Object.values(shows).sort((a, b) => a.time.localeCompare(b.time) || a.label.localeCompare(b.label));
            // รอบที่เลือกไว้ไม่มีตั๋วแล้ว (เช่น ข้ามวัน) ให้เลือกใหม่
            if (selectedShow && !shows[selectedShow]) selectShow('');
            const select = document.getElementById('showSelect');
            select.innerHTML =
                `<option value="">👉 เลือกเรื่องและรอบที่จะสแกน</option>` +
                list.map(s => `<option value="${escapeHtml(s.key)}">${escapeHtml(s.label)} (${s.count} ที่นั่ง)</option>`).join('');
            select.value = selectedShow;
            renderScanLock();
        }

        // ยังไม่เลือกรอบ: ล็อกปุ่มเปิดกล้อง และทำให้ช่องเลือกรอบเด่น
        function renderScanLock() {
            const locked = !selectedShow;
            document.getElementById('showSelect').classList.toggle('need', locked);
            const btn = document.getElementById('startScan');
            btn.classList.toggle('locked', locked);
            if (!btn.disabled) btn.textContent = locked ? 'เลือกเรื่องและรอบด้านบนก่อนเปิดกล้อง' : 'เปิดกล้องเพื่อสแกน';
        }

        function selectShow(value) {
            selectedShow = value;
            store('mt_scan_show', value);
            if (!value) stopScanner();
            renderScanLock();
            renderStatus();
            if (!document.getElementById('searchView').classList.contains('hidden')) renderSearch();
        }

        function inSelectedShow(info) {
            return !!selectedShow && showKey(info) === selectedShow;
        }

        /* ===== สถานะการเข้าโรง (รวมรายการที่ยังรอส่ง) ===== */
        function checkinOf(key) {
            if (serverCheckins[key]) return serverCheckins[key];
            const p = pending.find(item => item.ref + '|' + item.seat === key);
            return p ? { t: p.scannedAt, by: session ? session.name : '', pending: true } : null;
        }

        function timeText(iso) {
            const d = new Date(iso);
            return isNaN(d) ? '-' : d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
        }

        function bookingProgress(ref) {
            const seats = Object.values(seatsByKey).filter(s => s.r === ref);
            const done = seats.filter(s => checkinOf(s.r + '|' + s.s)).length;
            return { done, total: seats.length };
        }

        /* ===== สแกน QR ===== */
        async function startScanner() {
            const btn = document.getElementById('startScan');
            if (!selectedShow) {
                alert('กรุณาเลือกเรื่องและรอบที่จะสแกนก่อน (ช่องด้านบน)');
                document.getElementById('showSelect').focus();
                return;
            }
            if (typeof Html5Qrcode !== 'function') {
                // โหลดแบบ defer จึงอาจยังไม่เสร็จถ้ากดเร็วมากหลังเปิดหน้า หรือเน็ตช้า
                alert('ตัวสแกนยังโหลดไม่เสร็จ กรุณารอสักครู่แล้วกดอีกครั้ง (ถ้ายังไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้า)');
                return;
            }
            btn.disabled = true;
            btn.textContent = 'กำลังเปิดกล้อง…';
            document.getElementById('reader').classList.remove('hidden');
            try {
                scanner = scanner || new Html5Qrcode('reader');
                await scanner.start(
                    { facingMode: 'environment' },
                    { fps: 10, qrbox: (w, h) => { const size = Math.floor(Math.min(w, h) * 0.75); return { width: size, height: size }; } },
                    onScan,
                    () => {}
                );
                btn.classList.add('hidden');
            } catch (e) {
                document.getElementById('reader').classList.add('hidden');
                alert('เปิดกล้องไม่ได้ กรุณาอนุญาตให้เว็บนี้ใช้กล้องในการตั้งค่าเบราว์เซอร์ แล้วลองอีกครั้ง\n\n(' + (e && e.message ? e.message : e) + ')');
            } finally {
                btn.disabled = false;
                renderScanLock();
            }
        }

        function stopScanner() {
            if (scanner && scanner.isScanning) scanner.stop().catch(() => {});
            document.getElementById('reader').classList.add('hidden');
            document.getElementById('startScan').classList.remove('hidden');
        }

        function onScan(text) {
            const now = Date.now();
            if (!document.getElementById('result').classList.contains('hidden')) return;
            if (text === lastScan.text && now - lastScan.at < SAME_QR_IGNORE_MS) return;
            lastScan = { text, at: now };
            handleQr(text);
        }

        // SHA-256 ของรหัสลับ 16 ตัวแรก ต้องตรงกับ tokenHash_ ใน Code.gs
        async function tokenHash(token) {
            const bytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(token));
            return Array.from(new Uint8Array(bytes)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
        }

        async function handleQr(text) {
            const parts = String(text).split('|');
            if (parts.length !== 4 || parts[0] !== QR_PREFIX) {
                showResult('bad', '✕', 'ไม่ใช่ QR ของโรงหนัง', '', '', 'กรุณาให้ลูกค้าเปิด QR จากอีเมลยืนยันการจอง');
                return;
            }
            const [, ref, seat, token] = parts;
            const key = ref + '|' + seat;
            const info = seatsByKey[key];
            if (!selectedShow) {
                showResult('warn', '!', 'ยังไม่ได้เลือกรอบ', seat, '', 'กรุณาเลือกเรื่องและรอบที่จะสแกนด้านบนก่อน');
                return;
            }

            // ไม่อยู่ในรายชื่อวันนี้ในเครื่อง (เช่น เพิ่งยืนยัน หรือเป็นตั๋ววันอื่น) ให้ระบบกลางตรวจทันที
            if (!info) {
                showResult('wait', '⏳', 'กำลังตรวจกับระบบ…', seat, '', 'ไม่พบในรายชื่อตั๋ววันนี้ที่โหลดไว้');
                // ส่งรอบที่เลือกไปด้วย ระบบกลางจะไม่รับถ้าตั๋วเป็นรอบอื่น
                await checkinNow({ ref, seat, token, method: 'qr', show: selectedShow });
                return;
            }
            if (await tokenHash(token) !== info.h) {
                showResult('bad', '✕', 'QR ไม่ถูกต้อง', seat, showLabel(info), 'QR นี้ไม่ใช่ของระบบจริง กรุณาติดต่อเจ้าหน้าที่');
                return;
            }
            // ตั๋วถูกต้องแต่เป็นรอบอื่น: เตือนและไม่บันทึก (ถ้าจะให้เข้า ให้เปลี่ยนรอบด้านบน หรือใช้ค้นหาชื่อ)
            if (!inSelectedShow(info)) {
                showResult('warn', '!', 'ตั๋วต่างรอบ', seat, showLabel(info),
                    `${nameHtml(info)}ตอนนี้กำลังสแกนรอบ ${escapeHtml(selectedShow.replace('|', ' · '))} น.<br>ยังไม่ได้บันทึกการเข้าโรง`);
                return;
            }
            const existing = checkinOf(key);
            if (existing) {
                showResult('bad', '!', 'เข้าโรงไปแล้ว', seat, showLabel(info),
                    `${nameHtml(info)}เข้าเมื่อ ${timeText(existing.t)} น. โดย ${escapeHtml(existing.by)}`);
                return;
            }
            addPending({ ref, seat, token, method: 'qr' });
            const progress = bookingProgress(ref);
            showResult('ok', '✓', 'เข้าโรงได้', seat, showLabel(info),
                `${nameHtml(info)}รายการนี้เข้าแล้ว ${progress.done} จาก ${progress.total} ที่นั่ง`);
        }

        function nameHtml(info) {
            return `<span class="r-name">${escapeHtml(info.n)}</span>`;
        }

        /* ===== เช็คอิน ===== */
        function newItem(fields) {
            return Object.assign({
                id: deviceId + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
                device: deviceId,
                scannedAt: new Date().toISOString()
            }, fields);
        }

        function addPending(fields) {
            pending.push(newItem(fields));
            store('mt_scan_pending', pending);
            renderStatus();
            syncPending();
        }

        // ใช้ตอนที่นั่งไม่อยู่ในรายชื่อในเครื่อง: ส่งทันทีแล้วรอผลจากระบบกลาง
        async function checkinNow(fields) {
            const item = newItem(fields);
            try {
                const res = await postJson({ action: 'checkin', pin: session.pin, items: [item] });
                if (!res || !res.success) throw new Error((res && res.message) || 'ระบบไม่ตอบรับ');
                if (res.checkins) serverCheckins = res.checkins;
                const r = res.results[0];
                if (r.status === 'ok') {
                    showResult('ok', '✓', 'เข้าโรงได้', r.seat, r.m ? `${r.m} · ${r.time} น.` : '',
                        (r.n ? `<span class="r-name">${escapeHtml(r.n)}</span>` : '') + 'ตรวจกับระบบแล้ว');
                    refreshData();
                } else if (r.status === 'duplicate') {
                    showResult('bad', '!', 'เข้าโรงไปแล้ว', r.seat, '', `เข้าเมื่อ ${timeText(r.t)} น. โดย ${escapeHtml(r.by)}`);
                } else {
                    showResult('bad', '✕', 'เข้าโรงไม่ได้', r.seat, '', escapeHtml(r.message || ''));
                }
                setOnline(true);
            } catch (e) {
                setOnline(false);
                showResult('warn', '!', 'ตรวจสอบไม่ได้ตอนนี้', fields.seat, '',
                    'อินเทอร์เน็ตมีปัญหา และที่นั่งนี้ไม่อยู่ในรายชื่อที่โหลดไว้<br>ให้ลูกค้ารอสักครู่ หรือลองสแกนใหม่');
            }
            renderStatus();
        }

        // ส่งรายการที่รอส่งทั้งหมดในครั้งเดียว
        async function syncPending() {
            if (syncing || !session || !pending.length) return;
            syncing = true;
            const batch = pending.slice(0, 100);
            try {
                const res = await postJson({ action: 'checkin', pin: session.pin, items: batch });
                if (!res || !res.success) {
                    if (res && res.authError) {
                        alert(res.message);
                        logout(true);
                    }
                    throw new Error((res && res.message) || 'ระบบไม่ตอบรับ');
                }
                const sentIds = new Set(batch.map(b => b.id));
                (res.results || []).forEach(r => {
                    if (r.status === 'duplicate') {
                        addAlert('warn', `⚠ ที่นั่ง <b>${escapeHtml(r.seat)}</b> ถูกเช็คอินไปก่อนแล้วโดย ${escapeHtml(r.by)} เมื่อ ${timeText(r.t)} น. (อาจมีการใช้ QR ซ้ำ)`);
                    } else if (r.status === 'invalid') {
                        addAlert('bad', `✕ ที่นั่ง <b>${escapeHtml(r.seat)}</b> ระบบไม่รับ: ${escapeHtml(r.message || '')}`);
                    }
                });
                pending = pending.filter(p => !sentIds.has(p.id));
                store('mt_scan_pending', pending);
                if (res.checkins) serverCheckins = res.checkins;
                setOnline(true);
            } catch (e) {
                setOnline(false);
            } finally {
                syncing = false;
                renderStatus();
            }
        }

        async function manualCheckin(ref, seat) {
            const info = seatsByKey[ref + '|' + seat];
            if (!info || !inSelectedShow(info) || checkinOf(ref + '|' + seat)) return;
            if (!confirm(`เช็คอินที่นั่ง ${seat} ของ ${info.n}\n${showLabel(info)}\n\n(ใช้เมื่อลูกค้าไม่มี QR ควรตรวจบัตรประชาชนหรือเบอร์โทรก่อน)`)) return;
            addPending({ ref, seat, token: '', method: 'manual' });
            renderSearch();
            showResult('ok', '✓', 'เข้าโรงได้', seat, showLabel(info), nameHtml(info) + '(ค้นหาชื่อ)');
        }

        /* ===== แสดงผล ===== */
        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function beep(ok) {
            try {
                const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
                const tones = ok ? [[880, 0, .12]] : [[220, 0, .18], [220, .25, .18]];
                tones.forEach(([freq, start, dur]) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.frequency.value = freq;
                    gain.gain.value = .2;
                    osc.connect(gain).connect(ctx.destination);
                    osc.start(ctx.currentTime + start);
                    osc.stop(ctx.currentTime + start + dur);
                });
            } catch (e) { /* ไม่มีเสียงก็ใช้งานได้ */ }
            if (navigator.vibrate) navigator.vibrate(ok ? 80 : [120, 80, 120]);
        }

        // ผลทุกแบบ (รวมสีเขียว) ค้างไว้จนทีมงานกด "สแกนต่อ" ให้มีเวลาอ่านชื่อ หนัง และรอบ
        function showResult(type, icon, title, seat, show, detailHtml) {
            const el = document.getElementById('result');
            el.className = type;
            document.getElementById('rIcon').textContent = icon;
            document.getElementById('rTitle').textContent = title;
            document.getElementById('rSeat').textContent = seat ? seat : '';
            document.getElementById('rShow').textContent = show || '';
            document.getElementById('rShowWrap').classList.toggle('hidden', !show);
            document.getElementById('rDetail').innerHTML = detailHtml || '';
            document.getElementById('rNext').classList.toggle('hidden', type === 'wait');
            if (type !== 'wait') beep(type === 'ok');
        }

        function closeResult() {
            document.getElementById('result').classList.add('hidden');
            lastScan.at = Date.now(); // กันกล้องอ่าน QR เดิมซ้ำทันทีหลังปิด
        }

        function addAlert(type, html) {
            const box = document.createElement('div');
            box.className = 'alert ' + (type === 'bad' ? 'bad' : '');
            box.innerHTML = `<div>${html}</div><button type="button" aria-label="ปิด">✕</button>`;
            box.querySelector('button').onclick = () => box.remove();
            document.getElementById('alerts').prepend(box);
            beep(false);
        }

        function setOnline(online) {
            document.getElementById('netDot').classList.toggle('off', !online);
        }

        // ตัวเลขด้านบนนับเฉพาะรอบที่เลือก (ยังไม่เลือก แสดงทั้งวันไว้ดูภาพรวม)
        function renderStatus() {
            const keys = Object.keys(seatsByKey).filter(k => !selectedShow || inSelectedShow(seatsByKey[k]));
            document.getElementById('statTotal').textContent = keys.length;
            document.getElementById('statIn').textContent = keys.filter(k => checkinOf(k)).length;
            document.getElementById('statPending').textContent = pending.length;
            document.getElementById('syncText').textContent = lastLoadedAt
                ? 'ตั๋ววันที่ ' + dataDate + ' · อัปเดต ' + lastLoadedAt.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                : 'ยังไม่ได้โหลดรายชื่อ';
        }

        function showTab(tab) {
            const scan = tab === 'scan';
            document.getElementById('scanView').classList.toggle('hidden', !scan);
            document.getElementById('searchView').classList.toggle('hidden', scan);
            document.getElementById('tabScan').classList.toggle('active', scan);
            document.getElementById('tabSearch').classList.toggle('active', !scan);
            if (!scan) {
                stopScanner();
                renderSearch();
                document.getElementById('searchInput').focus();
            }
        }

        // ค้นหาเฉพาะรอบที่เลือก แสดงทุกที่นั่งของรายการที่ตรง
        function renderSearch() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase().replace(/\s+/g, ' ');
            const out = document.getElementById('searchResults');
            if (!selectedShow) {
                out.innerHTML = '<div class="empty">กรุณาเลือกเรื่องและรอบที่จะสแกนด้านบนก่อน</div>';
                return;
            }
            if (q.length < 2) {
                out.innerHTML = '<div class="empty">พิมพ์อย่างน้อย 2 ตัวอักษร</div>';
                return;
            }
            const seats = Object.values(seatsByKey).filter(inSelectedShow);
            const matchedRefs = new Set();
            seats.forEach(s => {
                if ([s.n, s.p, s.r, s.s].join(' ').toLowerCase().includes(q)) matchedRefs.add(s.r);
            });
            const bookings = {};
            seats.forEach(s => {
                if (!matchedRefs.has(s.r)) return;
                (bookings[s.r] = bookings[s.r] || { name: s.n, phone: s.p, ref: s.r, show: showLabel(s), seats: [] }).seats.push(s);
            });
            const list = Object.values(bookings).slice(0, 30);
            if (!list.length) {
                out.innerHTML = '<div class="empty">ไม่พบรายการ (แสดงเฉพาะตั๋วที่ยืนยันแล้วของรอบที่เลือก)</div>';
                return;
            }
            out.innerHTML = list.map(o => `
                <div class="order">
                    <div class="order-name">${escapeHtml(o.name)}</div>
                    <div class="order-show">${escapeHtml(o.show)}</div>
                    <div class="order-meta">${escapeHtml(o.phone)} · ${escapeHtml(o.ref)}</div>
                    <div class="seat-buttons">
                        ${o.seats.sort((x, y) => x.s.localeCompare(y.s)).map(info => {
                            const seat = info.s;
                            const c = checkinOf(o.ref + '|' + seat);
                            return c
                                ? `<button class="seat-btn done" type="button" disabled>${escapeHtml(seat)}<small>เข้าแล้ว ${timeText(c.t)}</small></button>`
                                : `<button class="seat-btn" type="button" onclick="manualCheckin('${escapeHtml(o.ref)}','${escapeHtml(seat)}')">${escapeHtml(seat)}<small>กดเพื่อเช็คอิน</small></button>`;
                        }).join('')}
                    </div>
                </div>`).join('');
        }

        /* ===== เริ่มทำงาน ===== */
        setInterval(syncPending, SYNC_MS);
        setInterval(() => { if (!document.hidden) refreshData(); }, REFRESH_MS);
        window.addEventListener('online', () => { setOnline(true); syncPending(); refreshData(); });
        window.addEventListener('offline', () => setOnline(false));
        document.getElementById('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

        if (session) {
            showApp();
            refreshData();
            syncPending();
        } else {
            document.getElementById('login').classList.remove('hidden');
        }
    </script>
</body>
</html>
