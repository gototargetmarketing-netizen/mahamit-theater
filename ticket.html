<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f0f10">
    <!-- หน้าบัตรของลูกค้าแต่ละคน ไม่ให้ Google เก็บไปแสดงในผลค้นหา -->
    <meta name="robots" content="noindex">
    <title>บัตรเข้าชม | MAHAMIT THEATRE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- QR Code Generator (MIT) สร้าง QR ในมือถือเอง ไม่ต้องเรียก Apps Script (ตัวเดียวกับคอนเสิร์ต) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <style>
        :root {
            --dark: #0f0f10;
            --card: #18181b;
            --red: #8b1528;
            --gold: #d4af37;
            --cream: #f4f1ea;
            --line: #2a2a2e;
            --muted: #a1a1aa;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--dark);
            color: var(--cream);
            font-family: "Prompt", Arial, sans-serif;
        }
        header {
            text-align: center;
            padding: 26px 16px 22px;
            border-bottom: 3px solid var(--red);
            background: linear-gradient(180deg, #19191c 0%, #0f0f10 100%);
        }
        .brand { font-size: 12px; letter-spacing: 5px; font-weight: 600; color: var(--gold); }
        .title { font-size: 26px; font-weight: 700; letter-spacing: 3px; margin-top: 4px; }
        main { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
        .summary {
            background: var(--card);
            border: 1px solid var(--line);
            border-left: 4px solid var(--gold);
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 16px;
        }
        .movie { font-size: 22px; font-weight: 700; color: var(--gold); line-height: 1.3; }
        .when { font-size: 16px; margin-top: 4px; }
        .label { font-size: 12px; color: var(--muted); margin-top: 12px; }
        .value { font-size: 16px; font-weight: 600; word-break: break-all; }
        .tip { font-size: 14px; line-height: 1.6; color: var(--muted); text-align: center; margin: 0 0 16px; }
        .ticket {
            background: #fff;
            color: #1a1a1a;
            border-radius: 20px;
            padding: 20px 16px 18px;
            margin-bottom: 16px;
            text-align: center;
        }
        .seat { font-size: 30px; font-weight: 700; line-height: 1.1; margin-bottom: 12px; }
        .qr { width: min(78vw, 300px); margin: 0 auto; }
        .qr svg { display: block; width: 100%; height: auto; }
        .share {
            margin-top: 14px;
            border: 1px solid var(--red);
            background: #fff;
            color: var(--red);
            font: inherit;
            font-size: 15px;
            font-weight: 600;
            padding: 10px 22px;
            border-radius: 999px;
            cursor: pointer;
        }
        /* ปุ่มบันทึกบัตรเป็นรูป (20 พ.ย. 2569) ย้ายมาจากปุ่ม "บันทึกใบจอง" ในหน้าจองสำเร็จ รูปนี้มี QR จริง */
        .save {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            border: 2px solid #ffe38a;
            background: linear-gradient(135deg, #f3d27a, #d4af37);
            color: #111;
            font: inherit;
            font-size: 18px;
            font-weight: 700;
            padding: 15px 18px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(212,175,55,.25);
        }
        .save:disabled { opacity: .7; cursor: wait; }
        .save-note { font-size: 13px; color: var(--muted); text-align: center; margin: 8px 0 18px; line-height: 1.6; }
        .error {
            background: #2a1216;
            border-left: 4px solid var(--red);
            border-radius: 0 12px 12px 0;
            padding: 16px 18px;
            line-height: 1.7;
        }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            background: var(--red);
            color: #fff;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 14px;
            opacity: 0;
            transition: opacity .2s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
        footer { text-align: center; font-size: 11px; letter-spacing: 3px; color: var(--muted); padding-bottom: 24px; }
    </style>
</head>
<body>
    <header>
        <div class="brand">MAHAMIT</div>
        <div class="title">THEATRE</div>
    </header>
    <main id="app"></main>
    <div class="toast" id="toast"></div>
    <footer>A VINTAGE CINEMA EXPERIENCE</footer>
    <script>
        // ต้องตรงกับ QR_PREFIX ใน Code.gs (หน้าสแกนอ่านรูปแบบ MT1|เลขจอง|ที่นั่ง|รหัสลับ)
        const QR_PREFIX = 'MT1';

        function esc(value) {
            return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // ลิงก์จากอีเมล (ticketLink_ ใน Code.gs):
        // ticket.html#r=เลขจอง&n=ชื่อผู้จอง&m=ชื่อหนัง&d=วันฉาย&t=รอบ&s=A1.รหัสลับ,A2.รหัสลับ
        // ข้อมูลอยู่หลัง # จึงไม่ถูกส่งไปที่เซิร์ฟเวอร์ และหน้านี้ไม่ต้องเรียก Apps Script
        function readTicketData() {
            const params = new URLSearchParams(location.hash.slice(1));
            const seats = (params.get('s') || '').split(',').map(item => {
                const [seat, token] = item.split('.');
                return { seat, token };
            }).filter(t => /^[A-Z]\d{1,2}$/.test(t.seat || '') && /^[A-Za-z0-9_-]{16}$/.test(t.token || ''));
            return {
                bookingId: (params.get('r') || '').trim(),
                name: (params.get('n') || '').trim(),
                movie: (params.get('m') || '').trim(),
                date: (params.get('d') || '').trim(),
                time: (params.get('t') || '').trim(),
                lang: params.get('l') === 'en' ? 'en' : 'th',
                seats: seats
            };
        }

        // ภาษาของบัตร (ตามที่ลูกค้าเลือกตอนจอง ส่งมากับลิงก์ l=en — Code.gs ticketLink_)
        let lang = 'th';
        const tr = (th, en) => lang === 'en' ? en : th;

        // 2026-10-25 → Sun, 25 Oct 2026 (เหมือน formatEnDate_ ใน Code.gs)
        function formatEnDate(value) {
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
            if (!m) return value;
            const date = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return days[date.getDay()] + ', ' + Number(m[3]) + ' ' + months[Number(m[2]) - 1] + ' ' + m[1];
        }

        // 2026-10-25 → วันอาทิตย์ที่ 25 ต.ค. 2569 (เหมือน formatThaiDate_ ใน Code.gs)
        function formatThaiDate(value) {
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
            if (!m) return value;
            const date = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
            const days = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
            const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            return 'วัน' + days[date.getDay()] + 'ที่ ' + Number(m[3]) + ' ' + months[Number(m[2]) - 1] + ' ' + (Number(m[1]) + 543);
        }

        function qrSvg(text) {
            const qr = qrcode(0, 'M');
            qr.addData(text);
            qr.make();
            return qr.createSvgTag({ cellSize: 8, margin: 4, scalable: true });
        }

        // ลิงก์สำหรับส่ง QR ที่นั่งเดียวให้เพื่อน (เพื่อนเห็นแค่ที่นั่งของตัวเอง)
        function seatLink(data, ticket) {
            return location.origin + location.pathname +
                '#r=' + encodeURIComponent(data.bookingId) +
                '&n=' + encodeURIComponent(data.name) +
                '&m=' + encodeURIComponent(data.movie) +
                '&d=' + encodeURIComponent(data.date) +
                '&t=' + encodeURIComponent(data.time) +
                '&s=' + ticket.seat + '.' + ticket.token + (data.lang === 'en' ? '&l=en' : '');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        async function shareSeat(index) {
            const ticket = ticketData.seats[index];
            const url = seatLink(ticketData, ticket);
            const text = tr(`บัตรเข้าชม ${ticketData.movie} ที่นั่ง ${ticket.seat}`, `Ticket: ${ticketData.movie} seat ${ticket.seat}`) + ' | MAHAMIT THEATRE';
            try {
                if (navigator.share) {
                    await navigator.share({ title: text, text: text, url: url });
                    return;
                }
                await navigator.clipboard.writeText(url);
                showToast(tr('คัดลอกลิงก์แล้ว ส่งให้เพื่อนได้เลย', 'Link copied. You can send it to your friend.'));
            } catch (err) {
                // ผู้ใช้กดยกเลิกการแชร์ ไม่ต้องแจ้งอะไร
                if (err && err.name === 'AbortError') return;
                prompt(tr('คัดลอกลิงก์นี้ส่งให้เพื่อน', 'Copy this link and send it to your friend'), url);
            }
        }

        function render(data) {
            const app = document.getElementById('app');
            lang = data.lang;
            document.documentElement.lang = lang;
            document.title = tr('บัตรเข้าชม', 'Ticket') + ' | MAHAMIT THEATRE';
            if (!data.bookingId || !data.seats.length) {
                app.innerHTML = tr(`<div class="error"><b>ไม่พบข้อมูลบัตรเข้าชม</b><br>
                    กรุณาเปิดลิงก์จากอีเมลยืนยันการจองอีกครั้ง หรือติดต่อโรงภาพยนตร์พร้อมเลขจอง</div>`,
                    `<div class="error"><b>Ticket not found</b><br>
                    Please open the link in your confirmation email again, or contact the theatre with your booking number.</div>`);
                return;
            }
            if (typeof qrcode !== 'function') {
                app.innerHTML = tr(`<div class="error"><b>โหลดตัวสร้าง QR ไม่สำเร็จ</b><br>
                    กรุณาตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้านี้ หรือใช้ QR ในอีเมลแทน</div>`,
                    `<div class="error"><b>Could not load the QR generator</b><br>
                    Please check your internet connection and refresh this page, or use the QR codes in your email.</div>`);
                return;
            }
            const when = data.date ? tr(esc(formatThaiDate(data.date)) + (data.time ? ` · รอบ ${esc(data.time)} น.` : ''),
                esc(formatEnDate(data.date)) + (data.time ? ` · ${esc(data.time)}` : '')) : '';
            const summary = `
                <div class="summary">
                    ${data.movie ? `<div class="movie">${esc(data.movie)}</div>` : ''}
                    ${when ? `<div class="when">${when}</div>` : ''}
                    ${data.name ? `<div class="label">${tr('ชื่อผู้จอง', 'Name')}</div><div class="value">${esc(data.name)}</div>` : ''}
                    <div class="label">${tr('เลขจอง', 'Booking no.')}</div><div class="value">${esc(data.bookingId)}</div>
                    <div class="label">${tr('จำนวน', 'Seats')}</div><div class="value">${tr(data.seats.length + ' ที่นั่ง', String(data.seats.length))}</div>
                </div>
                <button class="save" id="saveBtn" type="button" onclick="saveTicketImage()">
                    <span aria-hidden="true">⬇</span><span id="saveLabel">${tr('บันทึกบัตรเป็นรูป', 'Save tickets as image')}</span>
                </button>
                <p class="save-note">${tr('รูปมี QR ครบทุกที่นั่ง ใช้สแกนเข้าโรงได้ เปิดจากอัลบั้มรูปได้แม้ไม่มีเน็ต',
                    'The image includes every seat\'s QR code and can be scanned at the entrance, even offline.')}</p>
                <p class="tip">${tr('แสดง QR ที่หน้าโรงภาพยนตร์<br>1 QR ต่อ 1 ที่นั่ง · กรุณาเพิ่มความสว่างหน้าจอ',
                    'Show your QR code at the theatre entrance<br>1 QR per seat · Please turn up your screen brightness')}</p>`;
            const tickets = data.seats.map((t, i) => {
                const payload = [QR_PREFIX, data.bookingId, t.seat, t.token].join('|');
                return `
                    <section class="ticket">
                        <div class="seat">${tr('ที่นั่ง', 'Seat')} ${esc(t.seat)}</div>
                        <div class="qr" aria-label="${tr('QR ที่นั่ง', 'QR for seat')} ${esc(t.seat)}">${qrSvg(payload)}</div>
                        ${data.seats.length > 1 ? `<button class="share" type="button" onclick="shareSeat(${i})">${tr('ส่งที่นั่งนี้ให้เพื่อน', 'Send this seat to a friend')}</button>` : ''}
                    </section>`;
            }).join('');
            app.innerHTML = summary + tickets;
            // สร้างรูปรอไว้เลย: iPhone เปิดหน้าแชร์ได้เฉพาะตอนที่กดปุ่มแล้วเรียกทันที ถ้ารอสร้างรูปนานจะถูกปฏิเสธ
            ticketImage = { key: location.hash, blob: null, promise: null };
            prepareTicketImage().catch(err => console.warn('Prepare ticket image failed:', err));
        }

        /* ----------------------------------------------------
         * บันทึกบัตรเป็นรูป PNG (20 พ.ย. 2569 ผู้ใช้ขอให้โหลดและแชร์ตั๋วได้ในที่เดียว)
         * รูปเดียวมี QR ครบทุกที่นั่ง (ผู้ใช้เลือก) สแกนเข้าโรงจากรูปในอัลบั้มได้แม้เน็ตไม่ดี
         * วาดลง canvas เอง (ไม่ใช้ html2canvas) เหตุผลเดียวกับรูปใบจองใน index.html:
         * ขนาดตัวหนังสือตายตัว ไม่เพี้ยนตามการตั้งค่าตัวหนังสือใหญ่ของเครื่อง / ไม่ต้องรอรูปอื่นในหน้า
         * ข้อความไทยวาดชิดซ้ายแล้วคำนวณกึ่งกลางเอง (Safari บน iPhone บางรุ่นจัดกึ่งกลางภาษาไทยเพี้ยน)
         * ---------------------------------------------------- */
        let ticketImage = { key: '', blob: null, promise: null };

        function withTimeout(promise, ms) {
            return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))]);
        }

        // ตัดบรรทัดตามความกว้าง ภาษาไทยไม่มีช่องว่างระหว่างคำ จึงใช้ Intl.Segmenter แบ่งคำ (ไม่มี = ตัดทีละตัวอักษร)
        function wrapLines(ctx, text, maxWidth) {
            const parts = typeof Intl !== 'undefined' && Intl.Segmenter
                ? Array.from(new Intl.Segmenter('th', { granularity: 'word' }).segment(text), x => x.segment)
                : Array.from(text);
            const lines = [];
            let line = '';
            parts.forEach(part => {
                if (line && ctx.measureText(line + part).width > maxWidth) { lines.push(line.trim()); line = part.trimStart(); }
                else line += part;
            });
            if (line.trim()) lines.push(line.trim());
            return lines.length ? lines : [''];
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        // วาด QR ทีละช่องลง canvas (คมชัด สแกนได้แม้ย่อรูป) ข้อความใน QR เหมือนที่แสดงบนหน้านี้
        function drawQr(ctx, text, x, y, size) {
            const qr = qrcode(0, 'M');
            qr.addData(text);
            qr.make();
            const count = qr.getModuleCount();
            const quiet = 4; // ขอบขาวรอบ QR ตามมาตรฐาน เครื่องสแกนต้องใช้
            const cell = Math.floor(size / (count + quiet * 2));
            const drawn = cell * (count + quiet * 2);
            const ox = x + Math.floor((size - drawn) / 2) + cell * quiet;
            const oy = y + Math.floor((size - drawn) / 2) + cell * quiet;
            ctx.fillStyle = '#000';
            for (let r = 0; r < count; r++) for (let c = 0; c < count; c++) {
                if (qr.isDark(r, c)) ctx.fillRect(ox + c * cell, oy + r * cell, cell, cell);
            }
        }

        function drawTicketImage(data) {
            const W = 1080, PAD = 72, CARD = W - PAD * 2, QR = 600;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const F = (weight, size) => `${weight} ${size}px Prompt, Arial, sans-serif`;
            // คำนวณความสูงก่อน (หัว + รายละเอียด + การ์ดที่นั่ง) แล้วค่อยวาดจริง
            ctx.font = F(700, 52);
            const titleLines = wrapLines(ctx, data.movie || '', W - PAD * 2);
            const when = data.date ? tr(formatThaiDate(data.date) + (data.time ? ` · รอบ ${data.time} น.` : ''),
                formatEnDate(data.date) + (data.time ? ` · ${data.time}` : '')) : '';
            const seatCard = 64 + 60 + 24 + QR + 48;
            // หัว 364 + ชื่อเรื่อง + วันเวลา + ช่องไฟ 20 + ชื่อ/เลขจอง 150 + การ์ดที่นั่ง + ข้อความท้าย 100 + ขอบล่าง 80
            const H = 364 + titleLines.length * 66 + (when ? 56 : 0) + 20 + 150 + data.seats.length * (seatCard + 36) + 100 + 80;
            canvas.width = W;
            canvas.height = H;
            ctx.textBaseline = 'top';
            ctx.textAlign = 'left';
            const center = (text, y, font, color) => {
                ctx.font = font; ctx.fillStyle = color;
                ctx.fillText(text, Math.round((W - ctx.measureText(text).width) / 2), y);
            };
            // ตัวอักษรอังกฤษเว้นระยะเอง (letterSpacing ใช้ไม่ได้ทุกเบราว์เซอร์)
            const spaced = (text, y, font, color, gap) => {
                ctx.font = font; ctx.fillStyle = color;
                const widths = Array.from(text).map(ch => ctx.measureText(ch).width);
                let x = (W - (widths.reduce((a, b) => a + b, 0) + gap * (text.length - 1))) / 2;
                Array.from(text).forEach((ch, i) => { ctx.fillText(ch, Math.round(x), y); x += widths[i] + gap; });
            };

            const bg = ctx.createLinearGradient(0, 0, 0, H);
            bg.addColorStop(0, '#2a0a10'); bg.addColorStop(0.18, '#0f0f10'); bg.addColorStop(1, '#0b0b0c');
            ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 6;
            roundRect(ctx, 18, 18, W - 36, H - 36, 36); ctx.stroke();

            let y = 76;
            spaced('MAHAMIT', y, F(600, 30), '#d4af37', 14); y += 48;
            spaced('THEATRE', y, F(700, 64), '#ffffff', 10); y += 88;
            spaced('A VINTAGE CINEMA EXPERIENCE', y, F(400, 22), '#a1a1aa', 6); y += 54;
            // ป้าย "บัตรเข้าชม"
            const pill = tr('บัตรเข้าชม · ใช้สแกนเข้าโรง', 'Admission ticket · Scan at entrance');
            ctx.font = F(600, 28);
            const pw = ctx.measureText(pill).width + 64;
            ctx.fillStyle = 'rgba(212,175,55,.14)'; roundRect(ctx, (W - pw) / 2, y, pw, 58, 29); ctx.fill();
            ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 2; roundRect(ctx, (W - pw) / 2, y, pw, 58, 29); ctx.stroke();
            center(pill, y + 11, F(600, 28), '#ffe38a'); y += 58 + 40;

            titleLines.forEach(line => { center(line, y, F(700, 52), '#d4af37'); y += 66; });
            if (when) { center(when, y + 4, F(400, 32), '#f4f1ea'); y += 56; }
            y += 20;
            const info = [];
            if (data.name) info.push(tr('ชื่อผู้จอง ', 'Name ') + data.name);
            info.push(tr('เลขจอง ', 'Booking no. ') + data.bookingId + tr(' · ' + data.seats.length + ' ที่นั่ง', ' · ' + data.seats.length + (data.seats.length > 1 ? ' seats' : ' seat')));
            info.forEach(t => { ctx.font = F(400, 28); const l = wrapLines(ctx, t, W - PAD * 2)[0]; center(l, y, F(400, 28), '#d4d4d8'); y += 44; });
            y += 130 - info.length * 44 + 20;

            data.seats.forEach(t => {
                ctx.fillStyle = '#ffffff'; roundRect(ctx, PAD, y, CARD, seatCard, 32); ctx.fill();
                center(tr('ที่นั่ง ', 'Seat ') + t.seat, y + 48, F(700, 60), '#1a1a1a');
                drawQr(ctx, [QR_PREFIX, data.bookingId, t.seat, t.token].join('|'), (W - QR) / 2, y + 48 + 60 + 24, QR);
                y += seatCard + 36;
            });

            y += 10;
            center(tr('1 QR ต่อ 1 ที่นั่ง · แต่ละ QR ใช้เข้าโรงได้ครั้งเดียว', '1 QR per seat · Each QR can be used once'), y, F(400, 26), '#a1a1aa');
            y += 48;
            center(tr('กรุณาเพิ่มความสว่างหน้าจอตอนสแกน', 'Please turn up your screen brightness when scanning'), y, F(400, 26), '#a1a1aa');
            return canvas;
        }

        function prepareTicketImage() {
            if (ticketImage.blob) return Promise.resolve(ticketImage.blob);
            if (ticketImage.promise) return ticketImage.promise;
            const data = ticketData;
            const key = ticketImage.key;
            const fontsReady = document.fonts && document.fonts.load
                ? withTimeout(Promise.all(['400 28px Prompt', '600 28px Prompt', '700 52px Prompt'].map(f => document.fonts.load(f, 'บัตรเข้าชม MAHAMIT'))), 3000).catch(() => null)
                : Promise.resolve();
            const promise = ticketImage.promise = withTimeout(fontsReady.then(() => new Promise((resolve, reject) =>
                drawTicketImage(data).toBlob(blob => blob ? resolve(blob) : reject(new Error('toBlob')), 'image/png'))), 20000)
                .then(blob => { if (ticketImage.key === key) ticketImage.blob = blob; return blob; })
                .finally(() => { if (ticketImage.promise === promise) ticketImage.promise = null; });
            return promise;
        }

        // แยกตามเครื่องว่าจะส่งรูปให้ลูกค้าแบบไหน (เหมือน deliverImage ใน index.html)
        // • ในแอป LINE/Facebook/IG: หน้าแชร์และการดาวน์โหลดมักใช้ไม่ได้ → แสดงรูปเต็มจอให้กดค้าง
        // • iPhone/iPad: หน้าแชร์มีทั้ง "บันทึกรูปภาพ" และส่งเข้า LINE (ดาวน์โหลดจะไปอยู่ในแอปไฟล์ ลูกค้าหาไม่เจอ)
        // • Android และคอม: ดาวน์โหลดตรงๆ (หน้าแชร์ Android ส่วนใหญ่ไม่มีปุ่มบันทึกลงแกลเลอรี)
        async function deliverImage(blob, fileName, shareTitle) {
            const ua = navigator.userAgent || '';
            const inAppBrowser = /\bLine\/|FBAN|FBAV|FB_IAB|Instagram/i.test(ua);
            const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (inAppBrowser) { showImagePreview(blob); return; }
            if (isIOS) {
                const file = new File([blob], fileName, { type: 'image/png' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try { await navigator.share({ files: [file], title: shareTitle }); }
                    catch (err) { if (!err || err.name !== 'AbortError') showImagePreview(blob); }
                } else {
                    showImagePreview(blob);
                }
                return;
            }
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            setTimeout(() => { URL.revokeObjectURL(url); link.remove(); }, 1500);
            showToast(tr('บันทึกรูปบัตรแล้ว ดูได้ในโฟลเดอร์ดาวน์โหลด/แกลเลอรี', 'Ticket image saved to your downloads/gallery.'));
        }

        // ทางสำรอง (แอป LINE/Facebook หรือเปิดหน้าแชร์ไม่ได้): แสดงรูปเต็มจอให้กดค้างบันทึก
        // Android ในแอป LINE มักไม่มีเมนูบันทึกตอนกดค้าง จึงบอกให้แคปหน้าจอแทน
        function showImagePreview(blob) {
            const url = URL.createObjectURL(blob);
            const hint = /Android/i.test(navigator.userAgent || '')
                ? tr('กดค้างที่รูปเพื่อบันทึก<br>ถ้าไม่มีเมนูบันทึก ให้แคปหน้าจอนี้ไว้', 'Press and hold the image to save it.<br>If there is no save option, take a screenshot.')
                : tr('กดค้างที่รูป แล้วเลือก "บันทึกรูปภาพ"', 'Press and hold the image, then choose "Save to Photos".');
            const overlay = document.createElement('div');
            overlay.id = 'imagePreview';
            overlay.style.cssText = 'position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);display:flex;flex-direction:column;align-items:center;padding:16px;gap:12px;overflow-y:auto;';
            overlay.innerHTML = `<p style="color:#ffd65a;font-size:15px;text-align:center;margin:0;line-height:1.6;">${hint}</p>
                <img src="${url}" alt="${tr('บัตรเข้าชม', 'Tickets')}" style="width:100%;max-width:480px;border-radius:14px;">
                <button type="button" style="background:#8b1528;color:#fff;border:1px solid #d4af37;border-radius:12px;padding:10px 28px;font:inherit;font-weight:700;flex-shrink:0;">${tr('ปิด', 'Close')}</button>`;
            overlay.querySelector('button').onclick = () => { overlay.remove(); URL.revokeObjectURL(url); };
            document.body.appendChild(overlay);
        }

        async function saveTicketImage() {
            const btn = document.getElementById('saveBtn');
            const label = document.getElementById('saveLabel');
            const fileName = tr('บัตร-', 'Tickets-') + ticketData.bookingId + '.png';
            let blob = ticketImage.blob;
            if (!blob) {
                btn.disabled = true;
                label.textContent = tr('กำลังสร้างรูป…', 'Preparing…');
                try {
                    blob = await prepareTicketImage();
                } catch (err) {
                    console.error('Ticket image error:', err);
                    alert(tr('บันทึกรูปไม่สำเร็จ กรุณาแคปหน้าจอ QR แต่ละที่นั่งไว้แทน', 'Could not create the image. Please take a screenshot of each QR code instead.'));
                    return;
                } finally {
                    btn.disabled = false;
                    label.textContent = tr('บันทึกบัตรเป็นรูป', 'Save tickets as image');
                }
            }
            await deliverImage(blob, fileName, tr('บัตรเข้าชม MAHAMIT THEATRE', 'MAHAMIT THEATRE tickets'));
        }

        let ticketData = readTicketData();
        render(ticketData);
        window.addEventListener('hashchange', () => {
            ticketData = readTicketData();
            render(ticketData);
        });
    </script>
</body>
</html>
